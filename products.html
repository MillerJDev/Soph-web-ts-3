<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North Star Bakery - Products</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="site-header"></header>
    <main>
        <h1 id="welcome-banner">Our Selection</h1>
        <figure><img src="images/bakery-bread_c.png" alt="A loaf of bread, our signature loaf" />
            <figcaption>Our signature loaf</figcaption>
        </figure>
        <p>We have a variety of items to choose from, ranging from breads, to pastries, to cakes, and more!</p>
        <section>
            <h2>Our Menu</h2>
            <div id="diet-filter" aria-label="Filter menu by dietary preference">
                <p id="filter-heading">Filter by dietary preference:</p>
                <div id="filter-buttons"></div>
                <p id="filter-status" aria-live="polite"></p>
                <button type="button" id="clear-filters">Clear filters</button>
            </div>
            <div id="menu-list"></div>
        </section>
    </main>
    <footer>Copyright - North Star Bakery</footer>
    <script src="script.js"></script>
</body>

</html>
