<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>North Star Bakery - Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header id="site-header"></header>
    <main>
        <h1 id="welcome-banner">Contact Us</h1>
        <p>You can reach us via our contact form below. For in-person inquiries:
            We're located on the corner of Middle Street in Middletown, TX at 123 Middle Street. We are open daily from
            6am to 1pm. Breakfast is served until 9am daily.</p>
        <form id="inquiry-form" novalidate>
            <fieldset>
                <legend>Inquiry</legend>

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
                <span class="error-message" id="name-error"></span>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="email-error"></span>

                <label for="pickup-date">Pickup Date</label>
                <input type="date" id="pickup-date" name="pickup-date" required>
                <span class="error-message" id="pickup-date-error"></span>

                <label for="request-type">Request Type</label>
                <select id="request-type" name="request-type" required>
                    <option value="">Please choose</option>
                    <option value="wedding">Wedding Catering</option>
                    <option value="pre-order">Pre-order</option>
                    <option value="general">General</option>
                </select>
                <span class="error-message" id="request-type-error"></span>

                <label for="inquiry-details">Inquiry Details</label>
                <textarea id="inquiry-details" name="inquiry-details"></textarea>

                <label for="allergy-notes">Allergy Notes (if applicable)</label>
                <textarea id="allergy-notes" name="allergy-notes"></textarea>

                <button type="submit">Submit Request</button>
                <p class="form-success" id="form-success"></p>
            </fieldset>
        </form>
    </main>
    <footer>Copyright - North Star Bakery</footer>
    <script src="script.js"></script>
</body>

</html>
